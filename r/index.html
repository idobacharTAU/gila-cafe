<style>
:root{
  --green:#446247;--green-deep:#2C4B30;--cream:#EEE6D9;--page:#FFFBF3;
  --terracotta:#BD6955;--ink:#141D15;--ink-muted:#4A544B;
  --display:'Rubik','Segoe UI',sans-serif;--body:'Assistant','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--green-deep);color:var(--cream);
  font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;text-align:center;
  display:flex;align-items:center;justify-content:center;padding:32px 22px;
  -webkit-font-smoothing:antialiased;
}
.card{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.badge{width:88px;height:80px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0;letter-spacing:-.02em}
p.lede{margin:6px 0 26px;color:#B9CDB8;font-size:1rem}
a.btn{
  display:block;width:100%;padding:16px 22px;border-radius:999px;
  font-family:var(--body);font-weight:700;font-size:1.02rem;text-decoration:none;
  margin-bottom:12px;
}
a.primary{background:var(--cream);color:var(--green-deep)}
a.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(238,230,217,.32)}
p.hint{margin:-4px 0 16px;font-size:.87rem;line-height:1.5;color:#8FA98E}
.foot{margin-top:18px;font-size:.86rem;color:#8FA98E}
.foot a{
  color:#B9CDB8;
  /* The phone number is the one thing on this page a customer taps with a thumb.
     As inline text its hit area was 76x18 CSS px — under the 24x24 WCAG minimum
     and well under Apple's 44pt. The padding grows the tap area to ~96x44;
     the matching negative margin keeps the footer sitting exactly where it did. */
  display:inline-block;
  padding:13px 10px;
  margin:-13px -10px;
  -webkit-tap-highlight-color:rgba(238,230,217,.18);
}
</style>

  <p class="hint" id="googleHint">כמה מילים כנות לוקחות חצי דקה — ועוזרות לנו מאוד.</p>

  <a class="btn ghost" id="instagram" href="https://instagram.com/gila.cafe">לעקוב אחרינו באינסטגרם</a>
  <a class="btn ghost" href="../">לדף של גילא</a>

</div>
